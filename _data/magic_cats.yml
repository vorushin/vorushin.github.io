sections:
  - id: candle
    image: candle.png
    image_w: 450
    image_h: 545
    scene: night
    alt:
      en: "A candle glowing on a windowsill against the starry night"
      de: "Eine Kerze leuchtet auf dem Fensterbrett vor dem Sternenhimmel"
      ru: "Свеча на подоконнике на фоне звёздной ночи"
    paragraphs:
      - en: >-
          In a certain town, the evening tales are carried from house to house by magic cats.
          The children there are put to bed just as they are here — by a papa or a mama, a
          grandma or a grandpa, or a big brother or sister. While the little ones are still
          small, they are sung songs and told the tales that the grown-ups once read
          themselves. But children grow, and one day the tales that were read have all run
          out — and new ones have to come from somewhere, for little ones do so love a bedtime
          tale! At our house we lie down very, very quietly, we close our eyes, and we wait
          for a story to come to Papa. But in that town, the stories are brought by cats.
        de: >-
          Es gibt eine Stadt, da tragen Zauberkatzen die Abendmärchen aus. Die Kinder dort
          werden genau wie bei uns zu Bett gebracht — von Papa oder Mama, von Oma oder Opa
          oder von den großen Geschwistern. Solange die Kinder noch klein sind, singt man
          ihnen Lieder vor und erzählt ihnen die Märchen, die man selbst einmal gelesen hat.
          Aber die Kinder werden größer, und irgendwann sind die gelesenen Märchen einfach
          alle — und neue müssen ja irgendwoher kommen, denn kleine Kinder hören vor dem
          Einschlafen doch so gern ein Märchen! Bei uns legen wir uns meistens ganz, ganz
          leise hin, machen die Augen zu und warten, bis eine Geschichte zu Papa kommt. In
          dieser Stadt aber bringen die Katzen die Märchen.
        ru: >-
          В одном городе вечерние сказки разносят волшебные коты. Там также, как и у нас,
          малышей укладывают спать папы или мамы, бабушки или дедушки, или старшие
          братья-сестры. Когда детки еще маленькие, им поют песенки и рассказывают сказки,
          которые когда-то прочитали. Но когда детки подрастают, то прочитанные сказочки уже
          заканчиваются и нужно их откуда-то брать, ведь малыши так любят слушать сказки перед
          сном! Мы обычно ложимся тихо-тихо, закрываем глазки и ждем, когда сказка придет к
          папе. А в этом городе сказки разносят коты.

  - id: summer-tree
    image: summer-tree.png
    image_w: 536
    image_h: 536
    scene: day-yellow
    alt:
      en: "A sunny tree by a house, a grey cat sitting above the window"
      de: "Ein sonniger Baum an einem Haus, über dem Fenster sitzt eine graue Katze"
      ru: "Солнечное дерево у дома, над окном сидит серый кот"
    paragraphs:
      - en: >-
          Nobody knows where the cats live. All anyone has ever noticed is that they walk
          along the tops of the trees. That is why this town is so full of trees. Before
          anybody builds a house, they first grow trees around it, taking care that the new
          trees join up with the other chains of trees. For nobody wants to live in a house
          without fairy tales.
        de: >-
          Niemand weiß, wo die Katzen wohnen. Man hat nur eines bemerkt: Sie laufen oben über
          die Wipfel der Bäume. Darum gibt es in dieser Stadt so viele Bäume. Bevor dort
          jemand ein Haus baut, pflanzt er zuerst Bäume und gibt acht, dass sie sich mit den
          anderen Baumketten verbinden. Denn niemand möchte in einem Haus ohne Märchen wohnen.
        ru: >-
          Никто не знает, где они живут. Заметили только, что коты ходят по вершинам деревьев.
          Поэтому в этом городе очень много деревьев. Прежде чем строить где-то дом, там сначала
          растят деревья, стараясь чтобы они соединились с другими цепочками деревьев. Ведь
          никто не хочет жить в доме без сказок.
      - en: >-
          The cats carry the tales in their teeth, each tale wrapped up in a little white
          sheet. The kittens help too. When a kitten is big enough, at first it just walks
          beside its papa cat or its mama cat — learning the way, learning how to slip in
          through the window. Then it begins to help with the carrying. Papa carries two big
          tales, and the kitten puffs along behind with one tiny little tale in its teeth.
          Soon it can carry a bigger tale, then two at once — and then, one day, it goes out
          and delivers the tales all by itself.
        de: >-
          Die Katzen tragen die Märchen im Maul, jedes in ein kleines weißes Laken gewickelt.
          Die Kätzchen helfen mit: Wenn ein Kätzchen groß genug ist, läuft es zuerst nur neben
          Katzenpapa oder Katzenmama her — es merkt sich den Weg und lernt, zum Fenster
          hereinzuschlüpfen. Dann hilft es beim Tragen. Papa trägt zwei große Märchen, und das
          Kätzchen schnauft und müht sich mit einem winzig kleinen Märchen im Maul. Bald trägt
          es ein größeres Märchen, dann gleich zwei auf einmal — und eines Tages trägt es die
          Märchen ganz allein aus.
        ru: >-
          Коты носят сказки в зубах. Сказки завернуты в маленькие белые простынки. Котам
          помогают котята - когда они подрастают, то сначала ходят с папой-котом или
          мамой-кошкой рядышком - запоминают дорогу, учатся заходить в окно. Потом уже помогают
          таскать сказки. Папа несет две большие сказки, а котенок пыхтит-старается с маленькой
          сказочкой в зубах. Потом уже таскает сказку побольше, потом целых две, а потом уже
          разносит сказочки без папы.

  - id: moon-milk
    image: moon-milk.jpg
    image_w: 738
    image_h: 796
    scene: night
    alt:
      en: "A moonbeam pours through the window of a little house"
      de: "Ein Mondstrahl fällt durch das Fenster eines Häuschens"
      ru: "Лунный луч льётся в окно домика"
    paragraphs:
      - en: >-
          Everyone is glad when the cats come, and everyone puts out a treat for them. These
          magic cats do not eat mice or little birds — for them, people gather moon milk. On
          full-moon nights, when the moon shines her very brightest, people set out little
          white saucers in the moonlight. The moon pours her light into them, and early in the
          morning, before the sun is up, the saucers are carried indoors and kept in a dark
          room. Then in the evening, just before bed, you put your saucer of moon milk out on
          the windowsill. And when the cat has handed over its little bundle with the tale
          inside, it pads across to the saucer and drinks up the moon milk. If a cat comes
          with its kitten, the kitten usually gets to the milk first — and papa or mama laps
          up whatever is left.
        de: >-
          Alle freuen sich, wenn die Katzen kommen, und alle stellen ihnen etwas Gutes hin.
          Diese Zauberkatzen fressen nämlich keine Mäuse und keine Vögelchen — für sie sammelt
          man Mondmilch. In den Vollmondnächten, wenn der Mond ganz hell scheint, stellen die
          Leute kleine weiße Schälchen ins Mondlicht hinaus. Der Mond gießt sein Licht hinein,
          und früh am Morgen, noch ehe die Sonne aufgeht, holt man die Schälchen herein und
          stellt sie in ein dunkles Zimmer. Und abends, kurz vor dem Schlafengehen, stellt man
          sein Schälchen mit Mondmilch aufs Fensterbrett. Wenn die Katze dann ihr Bündelchen
          mit dem Märchen abgegeben hat, tapst sie zum Schälchen hinüber und trinkt die
          Mondmilch. Kommt eine Katze mit ihrem Kätzchen, dann darf das Kätzchen meistens
          zuerst trinken — und Papa oder Mama schlecken auf, was übrig bleibt.
        ru: >-
          Котам очень рады и их угощают. Эти волшебные коты не едят мышек или птичек. Специально
          для них собирают лунное молоко. В полнолуние, когда луна светит ярко-ярко, люди
          выносят белые блюдечки и ставят под лунный свет. Луна льет туда свой свет, а рано
          утром, еще до восхода солнца, тарелочки нужно забрать и поставить в темную комнату. А
          вечером, перед тем как лечь в постель, блюдечко с лунным молоком нужно поставить на
          подоконник. Тогда кот, после того как отдаст узелок со сказкой, подойдет к блюдечку и
          будет пить лунное молоко. Обычно, когда кот ходит вместе с котенком, то котенок
          успевает попить молочко раньше, а уж папа или мама доедают то, что остается.

  - id: tree-library
    image: tree-library.png
    image_w: 500
    image_h: 500
    scene: day-green
    alt:
      en: "Two big trees with a hammock, a reading boy and bags of books hanging from the branches"
      de: "Zwei große Bäume mit Hängematte, einem lesenden Jungen und Büchertaschen an den Ästen"
      ru: "Два больших дерева: гамак, читающий мальчик и сумки с книгами на ветках"
    paragraphs:
      - en: >-
          In that town, people love their trees dearly. Along the great tree streets the old
          trees have had years and years to grow, and they have grown enormously tall and
          wonderfully wide. People love to sling hammocks up there and sleep sweetly in them,
          and in some of the trees there are little libraries — bags full of books hanging
          from the branches, just right for reading once you have climbed up. All sorts of
          beautiful birds live in the trees, and they live very happily, because the magic
          cats never hunt them. They love to flutter down to the people who sit reading in the
          branches, and the people feed them biscuits and bread.
        de: >-
          In dieser Stadt hat man die Bäume sehr lieb. In den großen Baumstraßen stehen die
          alten Bäume schon viele, viele Jahre, und so sind sie riesig hoch und mächtig breit
          geworden. Dort hängt man gern Hängematten auf und schläft süß darin, und in manchen
          Bäumen sind kleine Bibliotheken eingerichtet — an den Ästen hängen Taschen voller
          Bücher, gerade recht zum Lesen, wenn man hinaufgeklettert ist. In den Bäumen wohnen
          allerlei schöne Vögel, und es geht ihnen prächtig, denn die Zauberkatzen jagen sie
          nicht. Am liebsten fliegen sie zu den Menschen hinüber, die oben in den Zweigen
          lesen, und die füttern sie mit Keksen und Brot.
        ru: >-
          В этом городе очень любят деревья. А поскольку на главных деревьевых улицах старым
          деревьям много лет, то они успели вырости высоченными и широченными. На них любят
          вешать гамаки и сладко там спать, а на некоторых деревьях устраивают библиотеки -
          развешивают сумки с книгами, которые удобно читать, забравшись на ветку. На деревьях
          живут разные красивые птицы. Поскольку волшебные коты на них не охотятся, им очень
          хорошо живется. Они любят подлетать к людям, читающим на деревьях, и те кормят их
          печеньем или хлебом.

  - id: lavender-calf
    image: lavender-calf.png
    image_w: 620
    image_h: 602
    scene: dusk
    alt:
      en: "A white calf standing in tall lavender grass under the stars"
      de: "Ein weißes Kälbchen im hohen lavendelfarbenen Gras unter Sternen"
      ru: "Белый телёнок в высокой сиреневой траве под звёздами"
    paragraphs:
      - en: >-
          And when the children have grown a little, the magic cats begin to bring the tales
          to them. So the children learn to read the tales and to tell them all by themselves.
          And they learn to make up their own — or, truer still, they learn to see them, to
          notice them. For the magic worlds of the fairy tales are always all around us; you
          only have to learn to notice them. And whoever discovers those worlds begins to
          dream of them at night. A child falls asleep, and the tale comes into the dream —
          or, truer still, the child slips right into the tale itself. And that is so
          wonderful that many children come to love going to sleep. Daytime is lovely, of
          course — you can be with Papa and Mama, and find out new things, and play with your
          brothers and sisters and the other children on the playground. But at night — at
          night you can find yourself in a whole new magic fairy-tale world!
        de: >-
          Und wenn die Kinder groß geworden sind, bringen die Zauberkatzen die Märchen ihnen
          selbst. So lernen die Kinder, die Märchen selber zu lesen und zu erzählen. Und sie
          lernen, sich eigene Märchen auszudenken — nein, eigentlich lernen sie, die Märchen
          zu sehen, sie zu bemerken. Denn die Zauberwelten der Märchen sind ja immer um uns
          herum, man muss nur lernen, sie zu bemerken. Und wer diese Welten einmal entdeckt
          hat, dem erscheinen sie nachts im Traum. Das Kind schläft ein, und das Märchen kommt
          zu ihm in den Traum — nein, eigentlich schlüpft das Kind selbst mitten ins Märchen
          hinein. Und das ist so wunderschön, dass viele Kinder das Schlafengehen richtig lieb
          gewinnen. Der Tag ist natürlich herrlich — da kann man mit Papa und Mama zusammen
          sein, Neues entdecken und mit den Geschwistern und den anderen Kindern auf dem
          Spielplatz spielen. Aber nachts — nachts kann man in eine ganz neue Märchenwelt
          hineingeraten!
        ru: >-
          А когда дети подрастают, то волшебные коты приносят сказки им самим. И малыши учатся
          читать и рассказывать сказки сами. И учатся их придумывать. Точнее даже, учатся их
          видеть, замечать. Ведь волшебные миры сказок всегда вокруг нас, нужно только
          научиться их замечать. И те, кто открывает эти миры, тому они начинают сниться. Малыш
          засыпает, а сказка приходит к нему во сне, точнее он сам попадает в сказку. И это так
          замечательно, что многие начинают очень любить спать. Днем конечно очень здорово -
          можно дружить с папой и мамой, изучать что-то новое, играть с братиками-сестричками и
          другими детками на площадке. Но ведь ночью можно попасть в совершенно новый волшебный
          сказочный мир!

  - id: night-garden
    image: night-garden.png
    image_w: 560
    image_h: 560
    scene: night
    alt:
      en: "A starry night over a garden, a cat asleep in the grass, chalk-drawn clouds in the sky"
      de: "Sternennacht über einem Garten, eine Katze schläft im Gras, Kreidewolken am Himmel"
      ru: "Звёздная ночь над садом, в траве спит кот, в небе — нарисованные мелом облака"
    paragraphs:
      - en: >-
          You might dream of a world where everything is covered with water, and the people
          live in tall, round towers. Tall — because the towers must be dug deep, deep into
          the ground beneath the water, so that the waves cannot sweep them away. Round — so
          that the wind cannot tip them over. Between the towers ropes are stretched, and
          along the ropes you can ride from tower to tower. In one tower the rope is fastened
          up high, and in the next one lower down, so you go sliding along splendidly fast.
          Everyone has a special belt to lay over the rope — and away you roll! That is how
          people go visiting, and go to school, and simply go out for a ride.
        de: >-
          Vielleicht träumt man von einer Welt, in der alles mit Wasser bedeckt ist und die
          Menschen in riesenhohen, runden Türmen wohnen. Hoch müssen die Türme sein, weil man
          sie tief, tief in den Grund unter dem Wasser eingraben muss, damit die Wellen sie
          nicht fortreißen. Und rund müssen sie sein, damit der Wind sie nicht umwirft.
          Zwischen den Türmen sind Seile gespannt, und an den Seilen kann man von Turm zu Turm
          fahren. In dem einen Turm ist das Seil weiter oben festgemacht und im nächsten
          weiter unten, und darum saust man herrlich schnell hinüber. Jeder hat einen
          besonderen Gurt: Man legt ihn übers Seil — und los geht die Fahrt! So fährt man zu
          Besuch, so fährt man zur Schule, und manchmal fährt man auch einfach nur so.
        ru: >-
          Может присниться мир, в котором все покрыто водой, а люди живут в высоченных круглых
          башнях. Высоченных - потому что их нужно глубоко закапывать в землю под водой, чтобы
          их не сносило волнами. Круглых - чтобы их не валил ветер. А между башнями натянуты
          веревки, по которым можно переезжать с башни на башню. В одной башне веревка
          закреплена выше, а в другой - ниже, и поэтому по ней можно быстро ехать. У каждого
          есть специальный ремень, который можно положить на веревку и катиться. Так ходят в
          гости, в школу и просто гуляют.
      - en: >-
          And someone else might dream of a world where people live on the clouds. Life there
          is never dull: whenever your cloud rains itself out, you have to move house again.
          That is why everybody there loves the places where the sea meets the mountains best
          of all, for there the clouds go wandering to and fro all day long — in from the sea
          to the shore in the morning, and out from the shore to sea again in the evening. And
          the views there are simply wonderful!
        de: >-
          Und mancher träumt von einer Welt, in der die Menschen auf den Wolken wohnen.
          Langweilig wird es dort nie: Immer wenn sich die eigene Wolke abgeregnet hat, muss
          man wieder umziehen. Darum mögen dort alle die Gegenden am liebsten, wo das Meer auf
          die Berge trifft, denn da wandern die Wolken den ganzen Tag hin und her — morgens
          vom Meer ans Ufer und abends vom Ufer wieder aufs Meer hinaus. Und erst die
          Aussicht! Die ist dort einfach wunderschön.
        ru: >-
          А кому-то снится мир, где люди живут на облаках. Это нескучная жизнь, нужно постоянно
          куда-то переезжать, когда облака выливаются дождем. Поэтому там любят районы, где
          есть море и горы, ведь там облака постоянно гуляют туда-сюда: утром с моря на берег, а
          вечером с берега на море. Да и виды там прекрасные!

  - id: angel
    image: angel.png
    image_w: 550
    image_h: 550
    scene: pale
    alt:
      en: "An angel with cloud-blue hair, eyes closed, a little bird beside them"
      de: "Ein Engel mit wolkenblauem Haar, die Augen geschlossen, daneben ein Vögelchen"
      ru: "Ангел с облачно-голубыми волосами и птичка рядом"
    paragraphs:
      - en: >-
          And I have also heard that some children dream of the world of the magic cats
          themselves. There the cats walk on their hind legs, and live in little houses, and
          know how to talk. And they have a library there — no, not a library at all, but a
          magic garden of fairy tales. In that garden the tales grow on magic trees. Some
          tales grow for hundreds of years, and they are picked only on the most special days
          of all; others are picked the moment they ripen. Gardener cats walk among the trees
          and look after them — and the most skilful gardener cats of all can even dream up
          whole new trees.
        de: >-
          Und ich habe auch gehört, dass manche Kinder von der Welt der Zauberkatzen selbst
          träumen. Dort gehen die Katzen auf den Hinterbeinen, wohnen in kleinen Häusern und
          können sprechen. Und sie haben eine Bibliothek — nein, eigentlich gar keine
          Bibliothek, sondern einen Zaubergarten der Märchen. Dort wachsen die Märchen auf
          Zauberbäumen. Manche Märchen wachsen hunderte von Jahren, und die pflückt man nur zu
          ganz, ganz besonderen Anlässen; andere pflückt man, sobald sie reif sind. Durch den
          Garten gehen Katzengärtner und pflegen die Bäume — und die allergeschicktesten von
          ihnen können sich sogar ganz neue Bäume ausdenken.
        ru: >-
          А еще я слышал, что некоторым деткам снится мир волшебных котов. Они там ходят на
          задних лапах, живут в домиках и умеют разговаривать. А еще у них есть библиотека,
          вернее даже не библиотека, а волшебный сад сказок. Там на волшебных деревьях растут
          сказки. Некоторые сказки растут сотни лет и их срывают в самых особенных случаях, а
          некоторые срывают как только они поспеют. Там ходят коты-садовники, которые ухаживают
          за деревьями, а самые опытные могут даже придумывать новые деревья.

afterword:
  heading:
    en: "About this book"
    de: "Über dieses Buch"
    ru: "Об этой книжке"
  paragraphs:
    - en: >-
        This story was born at bedtime in 2012 — I made it up for our daughters, Eva and
        Marta, as I was putting them to sleep, and later I posted it on Facebook.
      de: >-
        Diese Geschichte ist 2012 beim Zubettbringen entstanden — ich habe sie mir für unsere
        Töchter Eva und Marta ausgedacht, während ich sie schlafen legte, und später habe ich
        sie auf Facebook gestellt.
      ru: >-
        Эта история появилась в 2012 году, перед сном — я придумывал её для наших дочек Евы и
        Марты, когда укладывал их спать, а потом опубликовал в фейсбуке.
    - en: >-
        Our friend Inese Mecinska read it there and, all on her own, drew pictures for
        it. My wife Iana then asked her to draw a few more, and together they turned the
        story into a real book — a tiny edition of ten or twenty copies for family and
        friends. Many years later, the little book has found its way onto this page — so that
        the magic cats can carry it a little further still.
      de: >-
        Unsere Freundin Inese Mecinska hat sie dort gelesen und ganz von sich aus Bilder
        dazu gezeichnet. Meine Frau Iana bat sie dann, noch ein paar Bilder dazuzumalen, und
        gemeinsam machten die beiden aus der Geschichte ein richtiges Buch — eine winzige
        Auflage von etwa zehn bis zwanzig Exemplaren für Familie und Freunde. Viele Jahre
        später hat das Büchlein nun auch den Weg auf diese Seite gefunden — damit die
        Zauberkatzen es noch ein Stückchen weitertragen können.
      ru: >-
        Наша подруга Инесса Мечинская прочитала её там и сама нарисовала к ней иллюстрации.
        Моя жена Яна попросила её дорисовать ещё, и вместе они превратили историю в настоящую
        книжку — крошечный тираж, экземпляров десять-двадцать, для родных и друзей. Много лет
        спустя книжка добралась и до этой страницы — чтобы волшебные коты разнесли её немного
        дальше.
